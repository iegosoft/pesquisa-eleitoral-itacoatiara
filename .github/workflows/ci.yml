# Integração contínua: a cada push na main e a cada Pull Request, instala o
# projeto numa máquina limpa e roda lint, testes e build. Se qualquer etapa
# falhar, as seguintes não rodam e a PR fica marcada como reprovada.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # Os testes de PaginaLogin e PaginaAdmin carregam src/services/firebase.js,
      # e o Firebase recusa iniciar sem chave. Como o .env não vai para o
      # repositório, usamos valores fictícios: os testes não acessam o banco.
      - name: Testes
        run: npm test
        env:
          VITE_FIREBASE_API_KEY: chave-ficticia-ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-pesquisa
          VITE_FIREBASE_STORAGE_BUCKET: ci-pesquisa.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ci'

      - name: Build
        run: npm run build
