<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pesquisa Eleitoral" />
    <meta name="description" content="Coleta e análise de intenção de voto em pesquisa eleitoral de rua em Itacoatiara-AM." />
    <script>
      // Aplica o tema antes de o app abrir, para não piscar o tema errado.
      (function () {
        var tema = 'escuro';
        try {
          var salvo = localStorage.getItem('pesquisa-eleitoral:tema');
          if (salvo === 'claro' || salvo === 'escuro') tema = salvo;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) tema = 'claro';
        } catch (e) {}
        document.documentElement.dataset.tema = tema;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Pesquisa Eleitoral Itacoatiara</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
